<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الصغار</title>
<style>
html,body{margin:0;height:100%;background:#fff7e0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),vid=document.getElementById('v');
let W,H,mode='menu',AC=null,homeDown=0,last=0,spawn=0,T=0,camOK=false,camMsg=0;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const COLORS=['#ff5a5f','#ffb400','#3ddc84','#2ea8ff','#b36bff','#ff7ac6'];
const PENTA=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784];

// ---------- Sound (all synthesized) ----------
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function voice(f0,f1,dur,o={}){
  if(!ac())return;
  const t0=AC.currentTime+(o.d||0),os=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
  os.type=o.t||'sawtooth';os.frequency.setValueAtTime(f0,t0);os.frequency.linearRampToValueAtTime(f1,t0+dur);
  fl.type=o.ft||'lowpass';fl.frequency.value=o.cut||1200;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(o.v||.3,t0+.03);g.gain.linearRampToValueAtTime(0,t0+dur);
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vh||6;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.frequency);l.start(t0);l.stop(t0+dur)}
  os.connect(fl);fl.connect(g);g.connect(AC.destination);os.start(t0);os.stop(t0+dur+.05);
}
function noise(dur,f,v=.3,d=0){
  if(!ac())return;
  const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),t0=AC.currentTime+d;
  s.buffer=b;fl.type='bandpass';fl.frequency.value=f;g.gain.value=v;
  s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t0);
}
const tone=(f,d=.25,t='triangle',v=.25)=>voice(f,f,d,{t,v,cut:4000});
const sfx={
  pop(){noise(.12,1800,.5);tone(pick(PENTA)*2,.25)},
  whoosh(){noise(.4,600,.15)},
  twinkle(){[0,1,2].forEach(i=>tone(PENTA[4+i]*2,.2,'sine',.15))&&0;[0,1,2].forEach(i=>voice(PENTA[4+i]*2,PENTA[4+i]*2,.2,{t:'sine',v:.15,d:i*.08,cut:5000}))},
  giggle(){for(let i=0;i<4;i++)voice(700+i*40,900,.09,{t:'triangle',v:.2,d:i*.11,cut:3000})},
  dog(){[0,.25].forEach(d=>{voice(420,180,.14,{d,cut:1400,v:.4});noise(.1,900,.2,d)})},
  cat(){voice(450,900,.35,{t:'sawtooth',cut:2200,vib:25,vh:7,v:.25});voice(900,500,.35,{d:.35,cut:2200,vib:25,vh:7,v:.25})},
  cow(){voice(140,110,1,{cut:550,vib:6,vh:5,v:.5})},
  sheep(){voice(380,330,.8,{cut:1500,vib:60,vh:28,v:.35})},
  duck(){[0,.2].forEach(d=>voice(650,320,.13,{t:'square',ft:'bandpass',cut:1100,d,v:.25}))},
  lion(){voice(110,70,1.2,{cut:500,vib:20,vh:35,v:.55});noise(1,300,.25)}
};

// ---------- Particles ----------
let parts=[];
function burst(px,py,n,ems){
  for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:rnd(-5,5),vy:rnd(-8,-1),l:1,c:pick(COLORS),e:ems?pick(ems):null,s:rnd(18,40),g:.18,r:rnd(-.2,.2),a:0});
}
function drawParts(){
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=.014;p.a+=p.r;
    x.globalAlpha=Math.max(p.l,0);
    if(p.e){x.save();x.translate(p.x,p.y);x.rotate(p.a);emoji(p.e,0,0,p.s);x.restore()}
    else{x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s/4,0,7);x.fill()}});
  x.globalAlpha=1;parts=parts.filter(p=>p.l>0);
}
function emoji(e,px,py,sz){x.font=sz+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';x.fillText(e,px,py)}

// ---------- Scenes ----------
const clouds=[0,1,2,3].map(i=>({x:rnd(0,1),y:rnd(.05,.4),s:rnd(.6,1.2),v:rnd(.00002,.00006)}));
function sky(c1,c2,sun){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,W,H);
  if(sun){x.save();x.translate(W-120,110);x.rotate(T*.3);emoji('☀️',0,0,110+Math.sin(T*2)*6);x.restore()}
  clouds.forEach(c=>{c.x=(c.x+c.v*16)%1.3;emoji('☁️',c.x*W-100,c.y*H,110*c.s)});
}
const MENU=['🎈','🐶','🎨','📷'],MODES=['balloons','animals','paint','camera'],ms=[1,1,1,1];
function mp(i){return{x:W*(i+.5)/4,y:H/2+Math.sin(T*2+i)*14,r:Math.min(W/8.5,H/3)}}

let balloons=[];
const ANIMALS=[['🐶','dog'],['🐱','cat'],['🐮','cow'],['🐑','sheep'],['🦆','duck'],['🦁','lion']];
const an=ANIMALS.map(()=>({t:-9}));
function cell(i){const s=Math.min(W/3,H/2),ox=(W-s*3)/2,oy=(H-s*2)/2+20;return{x:ox+s*(i%3+.5),y:oy+s*(Math.floor(i/3)+.5),s}}
const trails=new Map();let lastTone=0;

// ---------- Camera ----------
async function camStart(){
  camOK=false;camMsg=0;
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    vid.srcObject=s;await vid.play();camOK=true;
  }catch(e){camMsg=1}
}
function camStop(){try{vid.srcObject&&vid.srcObject.getTracks().forEach(t=>t.stop())}catch(e){}vid.srcObject=null;camOK=false}
function go(m){
  if(mode==='camera'&&m!=='camera')camStop();
  mode=m;balloons=[];parts=[];
  x.fillStyle='#10101c';x.fillRect(0,0,W,H);
  if(m==='camera')camStart();
}

// ---------- Input ----------
addEventListener('pointerdown',e=>{
  const px=e.clientX,py=e.clientY;ac();
  if(mode==='menu'){
    MENU.forEach((_,i)=>{const p=mp(i);if(Math.hypot(px-p.x,py-p.y)<p.r){ms[i]=1.4;sfx.twinkle();burst(p.x,p.y,14,['⭐','✨']);setTimeout(()=>go(MODES[i]),350)}});
    return;
  }
  if(px<110&&py<110){homeDown=performance.now();return}
  if(mode==='balloons'){
    for(let i=balloons.length-1;i>=0;i--){const b=balloons[i];
      if(Math.hypot((px-b.x)/.8,py-b.y)<b.r*1.15){sfx.pop();burst(b.x,b.y,20,['⭐','✨','💖',null,null]);balloons.splice(i,1);return}}
    sfx.whoosh();
  }else if(mode==='animals'){
    ANIMALS.forEach((a,i)=>{const p=cell(i);
      if(Math.abs(px-p.x)<p.s/2&&Math.abs(py-p.y)<p.s/2){an[i].t=T;sfx[a[1]]();burst(p.x,p.y-p.s*.2,8,['🎵','🎶','✨','💛'])}});
  }else if(mode==='paint'){
    trails.set(e.pointerId,{x:px,y:py,h:rnd(0,360)});
  }else if(mode==='camera'){
    burst(px,py,12,['🌟','💖','🎈','🦋','🌈']);sfx.giggle();
  }
});
addEventListener('pointermove',e=>{
  if(mode!=='paint')return;
  const t=trails.get(e.pointerId);if(!t)return;
  t.h=(t.h+4)%360;
  x.shadowColor='hsl('+t.h+',100%,60%)';x.shadowBlur=25;
  x.strokeStyle='hsl('+t.h+',90%,60%)';x.lineWidth=40;x.lineCap='round';
  x.beginPath();x.moveTo(t.x,t.y);x.lineTo(e.clientX,e.clientY);x.stroke();x.shadowBlur=0;
  t.x=e.clientX;t.y=e.clientY;
  const now=performance.now();
  if(now-lastTone>110){lastTone=now;tone(PENTA[Math.floor((1-t.y/H)*8.99)],.2,'sine',.18);if(Math.random()<.4)burst(t.x,t.y,1,['⭐','✨','💫'])}
});
function up(e){trails.delete(e.pointerId);homeDown=0}
addEventListener('pointerup',up);addEventListener('pointercancel',up);

// ---------- Loop ----------
function loop(ts){
  const dt=Math.min(50,ts-last);last=ts;T=ts/1000;
  if(mode==='menu'){
    sky('#ffe9a8','#ffd1e8',true);
    MENU.forEach((m,i)=>{const p=mp(i);ms[i]+=(1-ms[i])*.12;const r=p.r*ms[i];
      x.fillStyle=COLORS[i];x.beginPath();x.arc(p.x,p.y,r,0,7);x.fill();
      x.save();x.translate(p.x,p.y);x.rotate(Math.sin(T*2.5+i)*.12);emoji(m,0,0,r*1.1);x.restore()});
    drawParts();
  }else{
    if(mode==='balloons'){
      sky('#8fd3ff','#e8f7ff',true);
      spawn+=dt;
      if(spawn>700&&balloons.length<14){spawn=0;balloons.push({x:rnd(90,W-90),y:H+120,r:rnd(55,85),vy:rnd(.05,.1),c:pick(COLORS),ph:rnd(0,6),rb:Math.random()<.15})}
      balloons.forEach(b=>{b.y-=b.vy*dt;const bx=b.x+Math.sin(T*1.5+b.ph)*25,sw=Math.sin(T*1.5+b.ph)*.15;b.dx=bx;
        x.save();x.translate(bx,b.y);x.rotate(sw);
        x.strokeStyle='#555';x.lineWidth=2;x.beginPath();x.moveTo(0,b.r);x.quadraticCurveTo(10,b.r*1.6,0,b.r*2);x.stroke();
        if(b.rb){const g=x.createLinearGradient(0,-b.r,0,b.r);['#f55','#fb0','#3d8','#29f','#b6f'].forEach((q,i)=>g.addColorStop(i/4,q));x.fillStyle=g}else x.fillStyle=b.c;
        x.beginPath();x.ellipse(0,0,b.r*.8,b.r,0,0,7);x.fill();
        x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.ellipse(-b.r*.3,-b.r*.35,b.r*.15,b.r*.28,.4,0,7);x.fill();
        x.restore();b.x0=b.x});
      balloons=balloons.filter(b=>b.y>-b.r*2);
      drawParts();
    }else if(mode==='animals'){
      sky('#aee8ff','#d9f7d0',true);
      x.fillStyle='#8fd36b';x.fillRect(0,H*.82,W,H*.18);
      ANIMALS.forEach((a,i)=>{const p=cell(i),k=T-an[i].t,act=k<.9;
        let sx=1,sy=1,oy=Math.sin(T*2+i*1.3)*8,rot=Math.sin(T*1.5+i)*.05;
        if(act){const e=Math.sin(k*Math.PI*3)*Math.exp(-k*3);oy-=Math.abs(e)*p.s*.35;sx=1-e*.15;sy=1+e*.2;rot=Math.sin(k*18)*.25*(1-k)}
        x.save();x.translate(p.x,p.y+oy);x.rotate(rot);x.scale(sx,sy);emoji(a[0],0,0,p.s*.6);x.restore()});
      drawParts();
    }else if(mode==='paint'){
      x.fillStyle='rgba(16,16,28,.02)';x.fillRect(0,0,W,H);drawParts();
    }else{
      if(camOK&&vid.videoWidth){
        const s=Math.max(W/vid.videoWidth,H/vid.videoHeight),w=vid.videoWidth*s,h=vid.videoHeight*s;
        x.save();x.translate(W,0);x.scale(-1,1);x.drawImage(vid,(W-w)/2,(H-h)/2,w,h);x.restore();
        x.lineWidth=18;x.strokeStyle='hsl('+(T*80%360)+',90%,60%)';x.strokeRect(9,9,W-18,H-18);
        if(Math.random()<.04)parts.push({x:rnd(0,W),y:H+30,vx:rnd(-1,1),vy:rnd(-7,-4),l:1.5,e:pick(['🎈','🦋','⭐','💖']),s:rnd(30,50),g:-.02,r:.02,a:0});
      }else{
        sky('#2b2150','#6a3fa0');
        emoji(camMsg?'📷❌':'📷',W/2,H/2+Math.sin(T*3)*10,150);
      }
      drawParts();
    }
    x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.arc(55,55,40,0,7);x.fill();
    emoji('🏠',55,55,36);
    if(homeDown){
      const p=(performance.now()-homeDown)/1000;
      x.strokeStyle='#fff';x.lineWidth=6;x.beginPath();x.arc(55,55,46,-1.57,-1.57+6.28*Math.min(p,1));x.stroke();
      if(p>=1){go('menu');homeDown=0;sfx.whoosh()}
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
